name: Sushi Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, for example 1.0.0 (do not type the "v")'
        required: true
        type: string
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - Stable Release
          - Pre-release
        default: Stable Release
      notes:
        description: 'Release notes (optional; leave empty to auto-generate)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sushi-release
  cancel-in-progress: false

env:
  GRADLE_VERSION: "9.3.1"

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Validate version, branch and duplicates
        id: check
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow on the main branch (selected: $REF)."
            exit 1
          fi
          V="$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]')"
          V="${V#v}"
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
            echo "::error::Invalid version '$INPUT_VERSION'. Use the form 1.0.0 or 1.0.0-beta.1."
            exit 1
          fi
          if gh api "repos/${GH_REPO}/git/ref/tags/v${V}" >/dev/null 2>&1; then
            echo "::error::Tag v${V} already exists. Choose a new version number."
            exit 1
          fi
          if gh release view "v${V}" >/dev/null 2>&1; then
            echo "::error::A release for v${V} already exists. Choose a new version number."
            exit 1
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"

  build:
    name: Build release JAR
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build and test
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: gradle build "-Pversion=${VERSION}" --stacktrace --no-daemon

      - name: Verify the built JAR
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          JAR="build/libs/sushi-${VERSION}.jar"
          if [ ! -f "$JAR" ]; then
            echo "::error::Expected $JAR was not produced."
            ls -la build/libs || true
            exit 1
          fi
          unzip -p "$JAR" fabric.mod.json | VERSION="$VERSION" python3 -c "import json,os,sys; d=json.load(sys.stdin); assert d['id']=='sushi'; assert d['version']==os.environ['VERSION'], 'fabric.mod.json version mismatch: '+d['version']; print('fabric.mod.json OK')"
          unzip -l "$JAR" | grep -q 'ir/mmdkavir/sushi/client/SushiClient.class' || { echo "::error::Client entrypoint class is missing from the JAR."; exit 1; }

      - name: Upload JAR for publishing
        uses: actions/upload-artifact@v4
        with:
          name: sushi-release-jar
          path: build/libs/sushi-${{ needs.validate.outputs.version }}.jar
          if-no-files-found: error

      - name: Upload build logs and reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sushi-release-build-logs
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: sushi-release-jar
          path: dist

      - name: Create draft release, attach JAR, then publish
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          NOTES: ${{ inputs.notes }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          JAR="dist/sushi-${VERSION}.jar"
          test -f "$JAR"
          ARGS=(--draft --target "$TARGET_SHA" --title "Sushi v${VERSION}")
          if [ "$RELEASE_TYPE" = "Pre-release" ]; then
            ARGS+=(--prerelease)
          else
            ARGS+=(--latest)
          fi
          if [ -n "${NOTES// /}" ]; then
            ARGS+=(--notes "$NOTES")
          else
            ARGS+=(--generate-notes)
          fi
          # A draft has no tag yet, so a failure here leaves nothing public behind.
          gh release create "v${VERSION}" "$JAR" "${ARGS[@]}"
          gh release edit "v${VERSION}" --draft=false
          gh release view "v${VERSION}" --json tagName,isPrerelease,isDraft,assets \
            --jq '"Published \(.tagName) prerelease=\(.isPrerelease) draft=\(.isDraft) assets=\([.assets[].name] | join(","))"'

      - name: Remove leftover draft (on failure)
        if: failure()
        run: |
          if [ "$(gh release view "v${VERSION}" --json isDraft --jq .isDraft 2>/dev/null || echo false)" = "true" ]; then
            gh release delete "v${VERSION}" --yes || true
            echo "Removed incomplete draft release v${VERSION}."
          fi
