plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the Minecraft and Fabric repositories itself; Maven Central provides the JavaScript engine (Rhino).
	mavenCentral()
}

loom {
	// "main" holds Minecraft-independent core logic (config, profiles, macros, logging).
	// "client" holds everything that touches the Minecraft client (GUI, keybinds).
	splitEnvironmentSourceSets()

	mods {
		"sushi" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JavaScript engine: Mozilla Rhino, pure Java, no native code. Bundled inside the Sushi JAR (jar-in-jar),
	// so players do not need to install anything extra.
	implementation "org.mozilla:rhino:${project.rhino_version}"
	include "org.mozilla:rhino:${project.rhino_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def modVersion = project.version.toString()
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}
